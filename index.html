<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mr. Mohamed — ملف شخصي</title>
    <meta
      name="description"
      content="الملف الشخصي لـ Mr. Mohamed ومشروع جسر لترجمة الفيديو داخل المتصفح."
    />
    <meta name="theme-color" content="#090909" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #090909;
        --panel: #111111;
        --panel-hover: #151515;
        --line: #282828;
        --fg: #f1f1f1;
        --muted: #929292;
        --soft: #c8c8c8;
        --accent: #d9faff;
        --accent-ink: #0a1517;
        --sans: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(100% - 2rem, 48rem);
        min-height: 100vh;
        margin: 0 auto;
        padding: 3.5rem 0 2rem;
        display: flex;
        flex-direction: column;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .status::before {
        content: "";
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 50%;
        background: #b9ffcb;
      }

      .hero {
        padding: 5rem 0 3.5rem;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.12em;
      }

      h1 {
        min-height: 1.35em;
        margin: 0;
        color: var(--fg);
        font-size: clamp(2.2rem, 9vw, 4.5rem);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.04em;
        direction: ltr;
        text-align: right;
      }

      .caret {
        color: var(--accent);
        font-weight: 400;
      }

      .intro {
        max-width: 28rem;
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.9;
      }

      .section-label {
        margin: 0 0 0.8rem;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.12em;
      }

      .project {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem;
        border: 1px solid var(--line);
        border-radius: 0.7rem;
        background: var(--panel);
        text-decoration: none;
        transition: border-color 180ms ease, background 180ms ease;
      }

      .project:hover {
        border-color: #505050;
        background: var(--panel-hover);
      }

      .project-info {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }

      .project-icon {
        display: grid;
        width: 2.75rem;
        height: 2.75rem;
        flex: none;
        place-items: center;
        border: 1px solid #3a3a3a;
        border-radius: 0.55rem;
        color: var(--accent);
      }

      .project-icon svg {
        width: 1.45rem;
        height: 1.45rem;
      }

      .project h2 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .project p {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .arrow {
        color: var(--muted);
        font-size: 1.25rem;
        direction: ltr;
      }

      .contact-section {
        margin-top: 2.5rem;
      }

      .contacts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.7rem;
      }

      .contact {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        min-height: 3rem;
        padding: 0.75rem;
        border: 1px solid var(--line);
        border-radius: 0.55rem;
        color: var(--soft);
        font-size: 0.82rem;
        text-decoration: none;
        transition: border-color 180ms ease, color 180ms ease;
      }

      .contact:hover {
        border-color: #505050;
        color: var(--fg);
      }

      .contact svg {
        width: 1.05rem;
        height: 1.05rem;
        flex: none;
        color: var(--accent);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: auto;
        padding-top: 3.5rem;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .visits {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
      }

      .visits img {
        display: block;
        width: 4.8rem;
        height: 1.25rem;
      }

      @media (max-width: 520px) {
        .page {
          padding-top: 1.5rem;
        }

        .hero {
          padding: 4rem 0 3rem;
        }

        .contacts {
          grid-template-columns: 1fr;
        }

        .contact {
          min-height: 2.8rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topline">
        <span>ملف شخصي</span>
        <span class="status">متاح للتواصل</span>
      </div>

      <header class="hero">
        <p class="eyebrow">MR. MOHAMED / 2026</p>
        <h1 aria-label="Mr. Mohamed"><span id="typed"></span><span class="caret">_</span></h1>
        <p class="intro">أبني أدوات وتجارب ويب هادئة، عملية، وتشتغل مباشرة من المتصفح.</p>
      </header>

      <section aria-labelledby="project-label">
        <p class="section-label" id="project-label">مشروع مختار</p>
        <a class="project" href="https://haa48915-star.github.io/video-translator/" target="_blank" rel="noreferrer">
          <span class="project-info">
            <span class="project-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 19h18" />
                <path d="M5 17c2-8 12-8 14 0" />
                <path d="M7 13v6M12 11v8M17 13v6" />

            <span>
              <h2>جسر</h2>

          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </section>

      <section class="contact-section" aria-labelledby="contact-label">
        <p class="section-label" id="contact-label">تواصل</p>
        <div class="contacts">
          <a class="contact" href="https://github.com/haa48915-star" target="_blank" rel="noreferrer" aria-label="GitHub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4" />
              <path d="M9 18c-4.51 2-5-2-7-2" />
            </svg>
            <span>GitHub</span>
          </a>
          <a class="contact" href="https://wa.me/966530302196" target="_blank" rel="noreferrer" aria-label="واتساب">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z" />
              <path d="M8.8 8.4c.2-.3.4-.3.7-.3h.4c.2 0 .4.1.5.4l.6 1.4c.1.2.1.4-.1.6l-.5.6c.6 1.1 1.4 1.8 2.5 2.3l.5-.6c.2-.2.4-.2.7-.1l1.4.6c.3.1.4.3.4.5v.4c0 .3-.1.5-.4.7-.4.3-1 .4-1.5.2-2.7-.8-4.8-2.8-5.8-5.4-.2-.5-.1-1 .1-1.3Z" />
            </svg>
            <span>واتساب</span>
          </a>
          <a class="contact" href="https://www.tiktok.com/@ss54677763" target="_blank" rel="noreferrer" aria-label="تيك توك">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 4v10.2a3.8 3.8 0 1 1-3-3.7" />
              <path d="M14 4c.6 2.4 2.1 3.8 4.5 4.3" />
            </svg>
            <span>@ss54677763</span>
          </a>
        </div>
      </section>

      <footer class="footer">
        <span>© Mr. Mohamed</span>
        <span class="visits">
          <span>الزيارات</span>
          <img src="https://visitor-badge.laobi.icu/badge?page_id=haa48915-star.my-website&left_text=visits" alt="عدد الزيارات" loading="eager" />
        </span>
      </footer>
    </main>

    <script>
      (function () {
        var typed = document.getElementById("typed");
        var name = "Mr. Mohamed";
        var i = 0;

        function type() {
          typed.textContent = name.slice(0, ++i);
          if (i < name.length) setTimeout(type, 105);
        }

        type();
      })();
    </script>
  </body>
</html>
